<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Folio app icon. Apple's macOS grid: 1024 canvas, 824 x 824 body at
    (100,100), continuous-corner radius ~185. An ivory sheet with a
    terracotta Markdown mark on a warm stone base.
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F1E9"/>
      <stop offset="1" stop-color="#E4DDCD"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFEFB"/>
      <stop offset="1" stop-color="#F7F5EE"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE8DC"/>
      <stop offset="1" stop-color="#DCD5C5"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="0" y1="320" x2="0" y2="480">
      <stop offset="0" stop-color="#E0805F"/>
      <stop offset="1" stop-color="#C9663F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="bodyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5A4A2E" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#5A4A2E" flood-opacity="0.16"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- Body -->
  <g filter="url(#bodyShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#base)"/>
  </g>
  <g clip-path="url(#body)">
    <!-- soft top light -->
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
  </g>

  <!-- Sheet with a folded corner -->
  <g filter="url(#sheetShadow)">
    <path d="M292 214 H640 L750 324 V786 a24 24 0 0 1 -24 24 H292 a24 24 0 0 1 -24 -24 V238 a24 24 0 0 1 24 -24 Z" fill="url(#sheet)"/>
  </g>
  <path d="M640 214 V300 a24 24 0 0 0 24 24 H750 Z" fill="url(#fold)"/>

  <!-- Terracotta "#": the Markdown heading mark -->
  <g stroke="url(#mark)" stroke-width="30" stroke-linecap="round" fill="none">
    <path d="M362 330 L338 470"/>
    <path d="M430 330 L406 470"/>
    <path d="M318 377 H456"/>
    <path d="M310 426 H448"/>
  </g>

  <!-- Text lines -->
  <g fill="#D7D1C4">
    <rect x="330" y="540" width="356" height="24" rx="12"/>
    <rect x="330" y="600" width="316" height="24" rx="12"/>
    <rect x="330" y="660" width="340" height="24" rx="12"/>
    <rect x="330" y="720" width="220" height="24" rx="12"/>
  </g>
</svg>
